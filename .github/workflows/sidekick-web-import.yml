name: Sidekick guarded editor import
on:
  pull_request:
    paths:
      - "server/sidekick_web_import.py"
      - "server/sidekick_contract.py"
      - "server/engine.py"
      - "tools/test_slot_legality.py"
      - "tools/test_common_io_legality.py"
      - "server/solver.py"
      - "data/common_ios.json"
      - "server/sidekick_reconstruct.py"
      - "server/sidekick_preview.py"
      - "server/server.py"
      - "server/import_catalog.py"
      - "tools/preview_skif.py"
      - "tools/test_sidekick_web_import.py"
      - "tools/test_sidekick_contract.py"
      - "tools/test_sidekick_contract_sidekick.py"
      - "tools/test_skif_web_endpoint.py"
      - "tools/test_skif_import_catalog.py"
      - "static/app.js"
      - "tools/test_sidekick_incarnates_ui.cjs"
      - "static/index.html"
      - ".github/workflows/sidekick-web-import.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guarded-import:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run guarded import and identity lookup tests
        run: |
          python -m unittest discover -s tools -p test_sidekick_web_import.py -v
          python -m unittest discover -s tools -p test_sidekick_contract.py -v
          python -m unittest discover -s tools -p test_skif_import_catalog.py -v
          python -m unittest discover -s tools -p test_skif_reconstruct.py -v
          python -m unittest discover -s tools -p test_slot_legality.py -v
      - name: Verify browser javascript syntax and server compilation
        run: |
          node --check static/app.js
          node tools/test_sidekick_incarnates_ui.cjs
          python -m py_compile server/server.py

  flask-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused server runtime requirements
        run: python -m pip install flask==3.1.3 pulp==3.3.2 requests==2.33.0 brotli==1.2.0
      - name: Fetch pinned Sidekick v5 Homecoming contract and fixture
        uses: actions/checkout@v4
        with:
          repository: wednesdaywoe/coh-sidekick
          ref: 90e9b8eeaf59a2350e62587968f523a1e1371f88
          path: _sidekick_contract_fixture
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            contract/homecoming/manifest.json
            contract/homecoming/power-pools.json
            contract/homecoming/epic-pools.json
            contract/homecoming/bundle.json.gz
            contract/homecoming/mids-names.json
            contract/homecoming/archetypes.json
            contract/homecoming/boost-index.json
            contract/homecoming/enhancements.json
            contract/homecoming/levels.json
            contract/homecoming/powersets/stalker/primary/energy-melee.json
            contract/homecoming/powersets/stalker/secondary/energy-aura.json
            fixtures/skif/v5/rb5d_browser_pass.skif
          persist-credentials: false
      - name: Exercise real Flask endpoint and original Sidekick data
        run: |
          python -m unittest discover -s tools -p test_skif_web_endpoint.py -v
          python -m unittest discover -s tools -p test_common_io_legality.py -v
          python -m unittest discover -s tools -p test_sidekick_contract_sidekick.py -v
